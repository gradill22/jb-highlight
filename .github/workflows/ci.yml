# Runs the full test suite (plugin builds, Markdown, and browser tests) on every
# pull request and every push to main, on Linux and Windows with Node 22 and 24.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # report every platform, even if one fails
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci # also builds dist/ (the "prepare" script)

      # --with-deps installs Chromium's system libraries, which only Linux needs.
      - run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium

      - run: npm test
